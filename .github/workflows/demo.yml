name: CI Smoke Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write build artifact file
        run: |
          echo "CI smoke test artifact" > demo-build.txt
          echo "Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> demo-build.txt
          echo "Repository: mcpmark-eval-liuhezi/ci-smoke-lab-99" >> demo-build.txt
          cat demo-build.txt
      - name: Upload demo-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: demo-build.txt
          retention-days: 30
